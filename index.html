<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>JadwalKu</title>
    <link rel="stylesheet" href="style.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <h1>📅 JadwalKu</h1>

    <div class="container">
      <h2>Tambah Jadwal</h2>
      <input type="text" id="nama" placeholder="Nama Kegiatan" />
      <input type="date" id="tanggal" />
      <input type="time" id="waktu" />
      <button onclick="tambahJadwal()">Tambah</button>
    </div>

    <div class="container">
      <h2>Daftar Jadwal</h2>
      <ul id="listJadwal"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
