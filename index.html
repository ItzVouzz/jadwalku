<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JadwalKu</title>
    <link rel="stylesheet" href="style.css" />

    <meta name="theme-color" content="#6f7be6" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>JadwalKu</h1>
        <p>Atur jadwal kegiatanmu dengan rapi dan mudah</p>
      </div>

      <div class="content">
        <label>Nama Kegiatan</label>
        <input type="text" id="nama" placeholder="Contoh: Belajar Matematika" />

        <div class="row">
          <div>
            <label>Tanggal</label>
            <input type="date" id="tanggal" />
          </div>
          <div>
            <label>Waktu</label>
            <input type="time" id="waktu" />
          </div>
        </div>

        <button id="tambah">Tambah Jadwal</button>

        <h3>Daftar Jadwal</h3>
        <div id="list"></div>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("service-worker.js")
          .then(() => console.log("Service Worker aktif"))
          .catch((err) => console.log("SW gagal:", err));
      }
    </script>
  </body>
</html>
